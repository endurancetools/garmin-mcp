name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      # Layer violations fail here: oxlint no-restricted-imports + @nx/enforce-module-boundaries.
      # A manual run checks every project on every OS; pushes and PRs only the affected ones.
      - run: pnpm nx ${{ github.event_name == 'workflow_dispatch' && 'run-many' || 'affected' }} -t lint typecheck test build --parallel=3

  mcpb:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-mcpb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: dist/*.mcpb

