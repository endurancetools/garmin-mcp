# GitHub Pages site (Jekyll, "deploy from a branch": main, /docs). User documentation only; the
# repository's README.md and DEVELOPMENT.md are not part of the site.
# Theme: Minimal Mistakes (remote theme). Left sidebar from _data/navigation.yml (`docs`), table of
# contents on every page, search, author only in the footer,
# Mermaid diagrams through _includes/footer/custom.html.
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: default

title: Garmin MCP
name: Marcin Milewicz
description: Your Garmin Connect data in Claude Code, Claude Desktop and any other MCP client
url: https://endurancetools.github.io
baseurl: /garmin-mcp
repository: endurancetools/garmin-mcp
permalink: pretty
locale: en-US
search: true
breadcrumbs: true

# Link previews and search (E7-6). Every page sets its own `title` and `description` in front matter;
# `<title>` is "<page title> – Garmin MCP" unless the title already contains "Garmin MCP".
title_separator: "–"
og_image: /assets/images/og.png
og_image_alt: "Garmin MCP: training load and readiness from Garmin, in Claude"
# No X (Twitter) account yet (decision E7-6a), so no `twitter.username`; without it the theme writes no
# twitter:card, and _includes/head/custom.html adds `summary_large_image` instead.
# Search engine verification codes (E7-17): uncomment and paste the codes from Google Search Console
# and Bing Webmaster Tools.
# google_site_verification: ""
# bing_site_verification: ""
# There is no feed (jekyll-feed is not enabled); without this the theme links a missing /feed.xml.
atom_feed:
  hide: true
# Person JSON-LD on the home page (the theme's _includes/schema.html).
social:
  type: Person
  name: Marcin Milewicz
  links:
    - https://github.com/marcinmilewicz
    - https://www.linkedin.com/in/marcinmilewicz/

plugins:
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true

# The author appears only at the very bottom of every page (footer), not in the sidebar.
author:
  name: Marcin Milewicz

# The footer's copyright link; without it the theme links `url` alone (the user's GitHub Pages root, 404).
copyright_url: https://endurancetools.github.io/garmin-mcp/

footer:
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/endurancetools/garmin-mcp
    - label: npm
      icon: fab fa-fw fa-npm
      url: https://www.npmjs.com/package/garmin-mcp-server
    - label: LinkedIn
      icon: fab fa-fw fa-linkedin
      url: https://www.linkedin.com/in/marcinmilewicz/

defaults:
  - scope:
      path: ""
    values:
      layout: single
      sidebar:
        nav: docs
      toc: true
      toc_sticky: true
      toc_label: On this page
      read_time: false
      share: false
      related: false
      comments: false

exclude:
  - evals
  - vendor
  # SVG sources of the images in assets/images (scripts/brand-images.mjs), not part of the site.
  - assets/src
